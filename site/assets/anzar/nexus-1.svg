  <text x="36" y="152" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">01</tspan>  <tspan fill="#6b7280">// NEXUS — Web3 Developer &amp; Creator Marketplace</tspan></text>
<text x="36" y="176" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">02</tspan>  <tspan fill="#00ff9d">▸ Showcase &amp; sell AI agents, bots, apps, templates, scripts &amp; datasets</tspan></text>
<text x="36" y="200" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">03</tspan>  <tspan fill="#00ff9d">▸ Instanced WebGL particle field, PBR geometry, bloom &amp; chromatic shaders</tspan></text>
<text x="36" y="224" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">04</tspan>  <tspan fill="#00ff9d">▸ Neon-green (#00ff9d) design system powered by CSS @theme tokens</tspan></text>
<text x="36" y="248" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">05</tspan>  <tspan fill="#00ff9d">▸ Cursor-tilting spotlight cards, 7 sort modes &amp; verified reviews</tspan></text>
<text x="36" y="272" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">06</tspan>  <tspan fill="#00ff9d">▸ Crypto &amp; memecoin checkout rails with verifiable transaction ledger</tspan></text>
<text x="36" y="296" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">07</tspan>  <tspan fill="#00ff9d">▸ Prisma ORM + PostgreSQL + full bundle/route/vitals audit suite</tspan></text>
<text x="36" y="320" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">08</tspan>  <tspan fill="#e5e7eb"></tspan></text>
<text x="36" y="344" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">09</tspan>  <tspan fill="#e5e7eb">$ npm run setup &amp;&amp; npm run dev</tspan></text>
