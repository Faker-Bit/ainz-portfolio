  <circle cx="74" cy="30" r="5.5" fill="#ffe600"/>
  <text x="98" y="34" fill="#39ff14" font-family="ui-monospace, monospace" font-weight="700" font-size="12">🛸 CRISTIANO RONALDO #7 — LIVE ANIMATED S I U U U U U U U ! HOLOGRAM</text>
  <text x="928" y="34" fill="#00f0ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">PRESS [S] OR :suii</text>

