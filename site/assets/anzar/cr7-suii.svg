<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <radialGradient id="alienGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.22;0.42;0.22" dur="2.4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020805" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <style>
      .cr7-figure {
        transform-origin: 480px 280px;
        animation: cr7PowerBounce 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .body-row {
        fill: #39ff14;
        animation: energyWave 2.2s ease-in-out infinite;
      }
      .jersey-row {
        fill: #39ff14;
        animation: jerseyGoldWave 2.2s ease-in-out infinite;
      }
      .banner-row {
        fill: #00f0ff;
        animation: bannerStadiumWave 1.6s ease-in-out infinite;
      }
      .spark {
        font-family: ui-monospace, monospace;
        font-weight: 700;
        animation: sparkRise 2.4s linear infinite;
      }
      @keyframes cr7PowerBounce {
        0%, 100% { transform: translateY(0px) scale(1); }
        18% { transform: translateY(-9px) scale(0.985); }
        36% { transform: translateY(3px) scale(1.02); }
        52% { transform: translateY(0px) scale(1.005); }
      }
      @keyframes energyWave {
        0%, 70%, 100% { fill: #39ff14; filter: drop-shadow(0 0 3px rgba(57,255,20,0.5)); }
        35% { fill: #d8ffe2; filter: drop-shadow(0 0 8px #00f0ff); }
      }
      @keyframes jerseyGoldWave {
        0%, 65%, 100% { fill: #39ff14; }
        30% { fill: #ffe600; filter: drop-shadow(0 0 9px #ffe600); }
        45% { fill: #00f0ff; filter: drop-shadow(0 0 8px #00f0ff); }
      }
      @keyframes bannerStadiumWave {
        0%, 100% { fill: #00f0ff; transform: translateX(0px); }
        50% { fill: #ffe600; transform: translateX(3px); filter: drop-shadow(0 0 10px #ffe600); }
      }
      @keyframes sparkRise {
        0% { transform: translateY(15px); opacity: 0; }
        30% { opacity: 0.95; }
        80% { opacity: 0.85; }
        100% { transform: translateY(-55px); opacity: 0; }
      }
    </style>
  </defs>
  <rect width="960" height="560" fill="#020805"/>
  <rect width="960" height="560" fill="url(#alienGlow)"/>
  <rect x="16" y="14" width="928" height="532" rx="10" fill="#020905" fill-opacity="0.94" stroke="#39ff14" stroke-width="1.8"/>
