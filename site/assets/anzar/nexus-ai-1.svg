<text x="36" y="176" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">02</tspan>  <tspan fill="#10b981">▸ OpenAI · xAI Grok · Gemini · Claude · OpenRouter · Ollama / vLLM</tspan></text>
<text x="36" y="200" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">03</tspan>  <tspan fill="#10b981">▸ Live token streaming over Server-Sent Events (SSE)</tspan></text>
<text x="36" y="224" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">04</tspan>  <tspan fill="#10b981">▸ Web search fallback chain: Tavily → Brave → DuckDuckGo + citations</tspan></text>
<text x="36" y="248" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">05</tspan>  <tspan fill="#10b981">▸ Research Mode: plans multi-query search &amp; synthesizes cited report</tspan></text>
<text x="36" y="272" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">06</tspan>  <tspan fill="#10b981">▸ Permission-gated Agent Mode with sandboxed Python &amp; tool calls</tspan></text>
<text x="36" y="296" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">07</tspan>  <tspan fill="#10b981">▸ Document Q&amp;A (PDF, CSV, JSON, YAML, code) + persistent SQLite memory</tspan></text>
<text x="36" y="320" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#4b5563">08</tspan>  <tspan fill="#e5e7eb"></tspan></text>
